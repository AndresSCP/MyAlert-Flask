{% extends "base.html" %}
{% block content %}
<section class="form-card">
  <h1>{{ 'Crear cuenta' if registration else 'Ingresar' }}</h1>
  <form class="stack" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Usuario
      <input name="username" maxlength="40" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
    </label>
    {% if registration %}
      <label>Correo <input name="email" type="email" maxlength="254" autocomplete="email" value="{{ request.form.get('email', '') }}" required></label>
    {% endif %}
    <label>Contraseña
      <input name="password" type="password" maxlength="128" {% if registration %}minlength="8"{% endif %}
             autocomplete="{{ 'new-password' if registration else 'current-password' }}" required>
    </label>
    {% if registration %}
      <label>Repite la contraseña
        <input name="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </label>
    {% endif %}
    <button class="button">{{ 'Crear cuenta' if registration else 'Ingresar' }}</button>
  </form>
</section>
{% endblock %}
